<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>餘依香所</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- 加入主畫面後的 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="餘依香所">
  <meta name="theme-color" content="#7b7764">

  <!-- 主畫面圖示（iOS 讀這個），指向你的 logo -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s180">
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s180">
  <link rel="apple-touch-icon" sizes="167x167" href="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s167">
  <link rel="apple-touch-icon" sizes="152x152" href="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s152">
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s180">

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #efeae3;
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    .wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
    .logo { width: 130px; height: 130px; object-fit: contain; }
    .name { margin-top: 18px; font-size: 20px; color: #7b7764; font-weight: 700; letter-spacing: 3px; }
    .desc { margin-top: 8px; font-size: 13px; color: #b0a594; }
    .enter-btn {
      margin-top: 28px;
      display: inline-block;
      background: #7b7764; color: #fff;
      font-size: 17px; font-weight: 700;
      padding: 15px 44px;
      border: none; border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(123,119,100,0.3);
    }
    .enter-btn:active { transform: scale(0.97); }
    .note { margin-top: 22px; font-size: 12px; color: #c4baac; line-height: 1.6; max-width: 280px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="https://lh3.googleusercontent.com/d/1IoS9P7XyeD4bvVIwmaCazTzfeXzHse6Y=s260" alt="餘依香所">
    <div class="name">餘依香所</div>
    <div class="desc">材料、庫存與營運管理系統</div>

    <!-- 點一下跳轉到你的 App（Google 登入會正常出現）-->
    <a class="enter-btn" href="https://script.google.com/macros/s/AKfycbw0rnM8p4W12a96-dxoyyPZ6nA3gDPtG0EV6JCr2chKAbyvZfzT2fnV2Jt2fQjj6Eqg/exec">進入系統</a>

    <div class="note">首次進入需以 Google 帳號登入驗證，登入後即可使用。</div>
  </div>

  <script>
    // 自動跳轉（1.2 秒後），讓使用者先看到品牌畫面。
    // 若想停在這頁、改由使用者自己按「進入系統」，把下面整段 setTimeout 刪掉即可。
    setTimeout(function(){
      window.location.href = "https://script.google.com/macros/s/AKfycbw0rnM8p4W12a96-dxoyyPZ6nA3gDPtG0EV6JCr2chKAbyvZfzT2fnV2Jt2fQjj6Eqg/exec";
    }, 1200);
  </script>
</body>
</html>
